version: '3.8'

services:
  chroma:
    image: chromadb/chroma:latest # Or a specific version like 0.4.24
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma # Mount a volume for persistent data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"] 
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  chroma-admin-ui:
    image: fengzhichao/chromadb-admin:latest # Or a specific version
    ports:
      - "3001:3001" # Access the UI on localhost:3001
    environment:
      NEXT_PUBLIC_CHROMA_API_URL: "http://chroma:8000"
    depends_on:
      chroma:
        condition: service_healthy
    restart: always

networks:
  chroma_network:
    driver: bridge

volumes:
  chroma-data: